version: '3.8'

services:
  meai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meai-assistant
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OBSIDIAN_VAULT_PATH=/app/obsidian
      - DATABASE_URL=sqlite+aiosqlite:///./data/meai.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./obsidian:/app/obsidian
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  data:
  obsidian:
