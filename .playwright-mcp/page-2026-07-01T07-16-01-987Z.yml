      - paragraph [ref=f1e80]:
        - text: ">"
        - strong [ref=f1e81]: "Примечание:"
        - text: Данные о выручке, трендах и цифровых метриках по обоим конкурентам отсутствуют. Анализ основан на доступных нефинансовых показателях и контексте рынка.
      - heading "2. Главный вывод" [level=3] [ref=f1e82]
      - paragraph [ref=f1e83]: "> Конкурентное поле в сегменте «пластическая хирургия и косметология» Москвы выглядит крайне разреженным по доступным данным — прямой соперник один, и его цифровой след минимален. Это окно для рывка: клиент при активной диджитализации может занять позицию первого по узнаваемости и доверию, пока рынок не насытился."
      - heading "3. Сильные стороны клиента" [level=3] [ref=f1e84]
      - list [ref=f1e85]:
        - listitem [ref=f1e86]:
          - strong [ref=f1e87]: Инфраструктурное преимущество
          - text: — ИПХИК как институт с собственной клинической базой (и, вероятно, стационаром) может принимать более сложные хирургические случаи, недоступные частным кабинетам без стационара. Конкурент «Ланцетъ-центр» не раскрывает наличие стационара.
        - listitem [ref=f1e88]:
          - strong [ref=f1e89]: Кадровый потенциал
          - text: — несмотря на отсутствие точной цифры, статус института подразумевает научно-практическую базу и команду хирургов, способную составить конкуренцию 182 врачам «Ланцетъ-центра».
      - heading "4. Точки роста" [level=3] [ref=f1e90]
      - list [ref=f1e91]:
        - listitem [ref=f1e92]:
          - strong [ref=f1e93]: SEO и поисковая видимость
          - text: — ни у клиента, ни у конкурента нет измеримой SEO-оценки, что говорит о «пустом» цифровом поле. Создание качественного контента, техническая оптимизация и регистрация в справочниках могут вывести ИПХИК в топ уже за 12 недель (потенциал до +15 первичных пациентов в месяц по данным CI).
        - listitem [ref=f1e94]:
          - strong [ref=f1e95]: Социальные доказательства (Instagram + отзывы)
          - text: — у конкурента 0 действующих социальных сетей и пустой рейтинг на картах. Запуск Instagram-аккаунта ключевых хирургов с демонстрацией результатов, а также системный сбор отзывов на Яндекс.Картах и ПроДокторов позволят быстро нарастить доверие.
        - listitem [ref=f1e96]:
          - strong [ref=f1e97]: Публичная финансовая прозрачность
          - text: — отсутствие данных о выручке у обоих игроков говорит о «серой» зоне. Публикация ключевых показателей (рост пациентопотока, количество операций) может стать сигналом надёжности на фоне конкурента.
      - paragraph [ref=f1e98]: "---"
  - generic [ref=f1e100]:
    - generic [ref=f1e101]: ⚡ Технический аудит
    - heading "Технический аудит" [level=2] [ref=f1e102]
    - generic [ref=f1e103]:
      - paragraph [ref=f1e104]:
        - strong [ref=f1e105]: ТЕХНИЧЕСКИЙ АУДИТ САЙТА (iphk.ru)
      - heading "1. Текущее состояние" [level=3] [ref=f1e106]
      - paragraph [ref=f1e107]:
        - text: "Сайт клиники не справляется с мобильной нагрузкой: общая производительность по методике Lighthouse составляет всего"
        - strong [ref=f1e108]: 39 баллов из 100
        - text: ". Это означает, что страницы открываются медленно и заставляют потенциальных пациентов ждать:"
      - list [ref=f1e109]:
        - listitem [ref=f1e110]:
          - text: Основной контент появляется лишь спустя
          - strong [ref=f1e111]: 4,6 секунды
          - text: (норма – до 2,5 с), а первая отрисовка любого элемента занимает
          - strong [ref=f1e112]: 3,3 секунды
          - text: .
        - listitem [ref=f1e113]:
          - text: Суммарное время блокировки основного потока браузера –
          - strong [ref=f1e114]: 22,7 секунды
          - text: ; интерактивность наступает только через
          - strong [ref=f1e115]: 35,5 секунды
          - text: после начала загрузки.
      - paragraph [ref=f1e116]:
        - text: Положительный момент –
        - strong [ref=f1e117]: визуальная стабильность
        - text: ": CLS = 0, макет не «прыгает» при загрузке."
      - paragraph [ref=f1e118]:
        - text: "SEO-оценка не была проведена инструментом (состояние неизвестно), но есть проектный расчёт: при исправлении слабых мест можно получить до"
        - strong [ref=f1e119]: 15 первичных пациентов в месяц
        - text: при стоимости привлечения около
        - strong [ref=f1e120]: 800 рублей за пациента
        - text: ", первые результаты ожидаются через 12 недель."
      - heading "2. Что хорошо" [level=3] [ref=f1e121]
      - list [ref=f1e122]:
        - listitem [ref=f1e123]:
          - strong [ref=f1e124]: Стабильность интерфейса
          - text: ": нулевой Cumulative Layout Shift (CLS) исключает раздражающие смещения контента – пациент не кликнет случайно «не туда» и не уйдёт из-за дёргающегося экрана."
        - listitem [ref=f1e125]:
          - strong [ref=f1e126]: Рыночный контекст даёт фору
          - text: ": конкурент «Ланцетъ», судя по всей доступной информации из открытых источников, не имеет активной цифровой стратегии (нет Instagram, SEO не измерено), а сам рынок пластической хирургии Москвы остаётся разреженным в онлайне. Это окно возможностей – тот, кто первым поставит техническую базу, займёт топ выдачи."
      - heading "3. Критические проблемы" [level=3] [ref=f1e127]
      - list [ref=f1e128]:
        - listitem [ref=f1e129]:
          - strong [ref=f1e130]: Потеря пациентов на входе
          - text: . Каждая секунда задержки загрузки мобильной версии снижает конверсию. Пациент, который ищет хирурга со смартфона, просто не дождётся и уйдёт к конкурентам. При текущем LCP 4,6 с и TBT 22,7 с сайт теряет значительную часть трафика ещё до знакомства с врачами.
        - listitem [ref=f1e131]:
          - strong [ref=f1e132]: Отсутствие прозрачности и записи
          - text: ". Цены на услуги не отображаются (pricing_visible: false), онлайн-запись отсутствует. Это заставляет пациента звонить – неудобно, особенно когда решение принимается «здесь и сейчас». Для клиники это прямой недобор заявок."
        - listitem [ref=f1e133]:
          - strong [ref=f1e134]: SEO-фундамент не подтверждён
          - text: ". Инструмент не смог оценить даже базовые метрики, что косвенно указывает на возможные дефекты: отсутствие структурированных данных (JSON-LD), слабые метатеги, не оптимизированные заголовки. На фоне конкурента с 182 врачами и нулевым цифровым следом быстрая SEO-победа реальна, но без аудита упускается."
      - heading "4. Рекомендация – что исправить в первую очередь" [level=3] [ref=f1e135]
      - paragraph [ref=f1e136]:
        - strong [ref=f1e137]: Срочно (влияет на запись немедленно)
        - text: ":"
      - list [ref=f1e138]:
        - listitem [ref=f1e139]:
          - strong [ref=f1e140]: Ускорение загрузки страниц
          - text: ". Начать с компрессии изображений (особенно фото «до/после»), минификации CSS/JavaScript, внедрения ленивой загрузки контента. Если серверные мощности клиники слабы – подключить CDN. Цель: LCP менее 2,5 с, FCP менее 1,8 с. Результат – рост конверсии заявок с мобильных устройств и улучшение позиций в поиске (Google официально учитывает Core Web Vitals)."
        - list [ref=f1e141]:
          - listitem [ref=f1e142]:
            - strong [ref=f1e143]: Сделать цены и запись «в один клик»
            - text: . Вывести стоимость первичной консультации и популярных процедур на видные места. Внедрить кнопку «Записаться» с простой формой или интеграцию с любой медицинской CRM. Это уберёт главный барьер между пациентом и клиникой.
          - paragraph [ref=f1e144]: Параллельно – провести полноценный SEO-аудит и закрыть пробелы в мета-тегах, заголовках, мобильной адаптации. По нашей модели, уже через 12 недель сайт может выйти на поток до 15 целевых пациентов в месяц при стоимости привлечения ~800 рублей за первичный приём – более чем окупаемо на фоне среднего чека в пластической хирургии.
  - generic [ref=f1e146]:
    - generic [ref=f1e147]: ⭐ Отзывы и репутация
    - heading "Отзывы и репутация" [level=2] [ref=f1e148]
    - generic [ref=f1e149]:
      - paragraph [ref=f1e150]:
        - strong [ref=f1e151]: 1. Текущее состояние
        - text: На всех семи ключевых платформах (Яндекс.Карты, 2ГИС, Google Maps, ПроДокторов, Отзовик, IRecommend, Zoon)
        - strong [ref=f1e152]: у АО «ИПХиК» нет ни одного отзыва и ни одной оценки
        - text: "– полное отсутствие цифрового следа в open web. Для московской клиники с 2009–летним стажем и институтским статусом это крайне нетипично и создаёт серьёзный разрыв доверия: пациент, вбивая название в поиск, не видит ни социального подтверждения, ни контроля качества. Конкурент «Ланцетъ-центр» находится в таком же положении – его рейтинги также отсутствуют, однако это не смягчает ситуацию, а лишь говорит о том, что ниша «пластическая хирургия + косметология» в Москве остаётся «репутационно пустой» – и тот, кто первым заполнит её реальными историями, получит преимущество первого."
      - paragraph [ref=f1e153]:
        - strong [ref=f1e154]: 2. Что хвалят
        - text: Поскольку отзывов нет, предметных сильных сторон от пациентов не зафиксировано. Косвенно, опираясь на статус ИПХиК как института пластической хирургии с собственной клинической базой (контекст из CI-фазы), можно предположить, что сильными сторонами должны были бы стать сложные хирургические компетенции, наличие стационара и научный подход. Но без отзывов эта экспертиза остаётся «вещью в себе» – пациент не может убедиться в ней через чужой опыт.
      - paragraph [ref=f1e155]:
        - strong [ref=f1e156]: 3. На что жалуются
        - text: "Отсутствие отзывов само по себе является системной проблемой:"
      - list [ref=f1e157]:
        - listitem [ref=f1e158]:
          - strong [ref=f1e159]: Репутационная невидимость.
          - text: Даже если клиника работает безупречно, потенциальный пациент не получает тому подтверждений и может уйти к конкурентам, у которых есть хотя бы несколько оценок.
        - listitem [ref=f1e160]:
          - strong [ref=f1e161]: Риск негатива без противовеса.
          - text: Если случайный недовольный пациент оставит негативный отзыв на любой платформе, он станет единственным сигналом о клинике, и баланс будет разрушен за один день.
        - listitem [ref=f1e162]:
          - strong [ref=f1e163]: Отсутствие обратной связи.
          - text: Нет данных о реальной удовлетворённости пациентов, что затрудняет управление качеством сервиса.
        - listitem [ref=f1e164]:
          - strong [ref=f1e165]: Психологический барьер.
          - text: "Для эстетической медицины отзывы – критический фактор принятия решения; их полное отсутствие воспринимается как «красный флаг», особенно в сегменте anti-age и малоинвазивных процедур, где клиент особенно чувствителен к репутации (тренд рынка: спрос смещается именно туда)."
      - paragraph [ref=f1e166]:
        - strong [ref=f1e167]: 4. Рекомендация
        - text: Первоочередная задача –
        - strong [ref=f1e168]: "создать репутационное «пятно» на двух главных для медицинского пациента платформах: Яндекс.Карты и ПроДокторов."
        - text: "Это окно возможностей: конкурент «Ланцетъ» так же пуст, а значит даже 5–7 реальных положительных отзывов на каждой площадке дадут ИПХиК немедленное преимущество в восприятии. Конкретные шаги:"
      - list [ref=f1e169]:
        - listitem [ref=f1e170]:
          - strong [ref=f1e171]: Запустить системный сбор отзывов по пост-приёмному триггеру.
          - text: "Через 3 дня после операции/процедуры пациенту направляется персонализированное сообщение (WhatsApp/SMS/email) с прямой ссылкой на карточку Яндекс.Карт и анкету ПроДокторов, с простым сценарием «поделитесь впечатлением за 2 минуты». Мотивация: небольшой комплимент от клиники (скидка на следующую процедуру, уходовое средство) – законно и не нарушает правила платформ, если не требовать именно 5 звёзд."
        - listitem [ref=f1e172]:
          - strong [ref=f1e173]: Активировать внутренних «амбассадоров».
          - text: Предложить лояльным пациентам, которые уже положительно отзывались устно, оставить отзыв, сопроводив их (по желанию) подготовленными шаблонами – не фальшивыми, а просто напоминающими, какие детали важны другим пациентам (имя врача, описание результата, комфорт в стационаре).
        - listitem [ref=f1e174]:
          - strong [ref=f1e175]: Параллельно завести корпоративный Instagram с демонстрацией результатов.
          - text: Социальные сети ≠ отзывы, но они создают поле доверия; видя активность и реальные кейсы, пользователь с меньшим скепсисом воспримет будущие отзывы.
      - paragraph [ref=f1e176]:
        - strong [ref=f1e177]: "Почему это работает именно сейчас:"
        - text: Рынок эстетической медицины в Москве растёт на 12–15% в год, пациенты всё чаще ищут информацию онлайн, а регуляторный фон (лицензирование) подталкивает к прозрачности. ИПХиК, обладая инфраструктурой стационара и научным статусом, может быстро конвертировать медицинскую экспертизу в социальное доверие. Отсутствие отзывов сегодня – главный тормоз конверсии; через 4–6 недель системной работы он превратится в поток
