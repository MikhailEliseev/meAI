      - paragraph [ref=e79]:
        - text: ">"
        - strong [ref=e80]: "Примечание:"
        - text: Данные о выручке, трендах и цифровых метриках по обоим конкурентам отсутствуют. Анализ основан на доступных нефинансовых показателях и контексте рынка.
      - heading "2. Главный вывод" [level=3] [ref=e81]
      - paragraph [ref=e82]: "> Конкурентное поле в сегменте «пластическая хирургия и косметология» Москвы выглядит крайне разреженным по доступным данным — прямой соперник один, и его цифровой след минимален. Это окно для рывка: клиент при активной диджитализации может занять позицию первого по узнаваемости и доверию, пока рынок не насытился."
      - heading "3. Сильные стороны клиента" [level=3] [ref=e83]
      - list [ref=e84]:
        - listitem [ref=e85]:
          - strong [ref=e86]: Инфраструктурное преимущество
          - text: — ИПХИК как институт с собственной клинической базой (и, вероятно, стационаром) может принимать более сложные хирургические случаи, недоступные частным кабинетам без стационара. Конкурент «Ланцетъ-центр» не раскрывает наличие стационара.
        - listitem [ref=e87]:
          - strong [ref=e88]: Кадровый потенциал
          - text: — несмотря на отсутствие точной цифры, статус института подразумевает научно-практическую базу и команду хирургов, способную составить конкуренцию 182 врачам «Ланцетъ-центра».
      - heading "4. Точки роста" [level=3] [ref=e89]
      - list [ref=e90]:
        - listitem [ref=e91]:
          - strong [ref=e92]: SEO и поисковая видимость
          - text: — ни у клиента, ни у конкурента нет измеримой SEO-оценки, что говорит о «пустом» цифровом поле. Создание качественного контента, техническая оптимизация и регистрация в справочниках могут вывести ИПХИК в топ уже за 12 недель (потенциал до +15 первичных пациентов в месяц по данным CI).
        - listitem [ref=e93]:
          - strong [ref=e94]: Социальные доказательства (Instagram + отзывы)
          - text: — у конкурента 0 действующих социальных сетей и пустой рейтинг на картах. Запуск Instagram-аккаунта ключевых хирургов с демонстрацией результатов, а также системный сбор отзывов на Яндекс.Картах и ПроДокторов позволят быстро нарастить доверие.
        - listitem [ref=e95]:
          - strong [ref=e96]: Публичная финансовая прозрачность
          - text: — отсутствие данных о выручке у обоих игроков говорит о «серой» зоне. Публикация ключевых показателей (рост пациентопотока, количество операций) может стать сигналом надёжности на фоне конкурента.
      - paragraph [ref=e97]: "---"
