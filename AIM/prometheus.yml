global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aim-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"
  - "rules.yml"

# Scrape configurations
scrape_configs:
  # AIM Application
  - job_name: 'aim-app'
    static_configs:
      - targets: ['app:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']

  # PostgreSQL Exporter
  - job_name: 'aim-postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']


  # Node Exporter
  - job_name: 'aim-node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
