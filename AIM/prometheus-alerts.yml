groups:
  - name: aim_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(aim_api_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec"

      # High API cost
      - alert: HighAPICost
        expr: rate(aim_api_cost_usd_total[1h]) > 5.0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High API cost detected"
          description: "API cost is ${{ $value }}/hour"

      # Service down
      - alert: ServiceDown
        expr: up{job="aim-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AIM service is down"
          description: "Service has been down for more than 1 minute"

      # High response time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(aim_api_request_duration_seconds_bucket[5m])) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s"
