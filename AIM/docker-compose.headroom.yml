# HeadroomGuard Integration — Sidecar Proxy для экономии токенов
# Использование: docker-compose -f docker-compose.yml -f docker-compose.headroom.yml up -d

version: '3.8'

services:
  # HeadroomGuard прокси — компрессор контекста
  headroom-proxy:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: aim-headroom-proxy
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env.headroom
    environment:
      # Целевой LLM API (z.ai)
      - HEADROOM_UPSTREAM_URL=https://api.z.ai/api/coding/paas/v4
      - HEADROOM_UPSTREAM_AUTH=${OMNIROUTE_AUTH}

      # Режим компрессии
      - HEADROOM_MODE=optimize  # optimize | audit (audit = dry-run, только метрики)
      - HEADROOM_CACHE_PREFIX_TOKENS=8000  # Размер кэшируемого префикса

      # Настройки компрессии
      - HEADROOM_COMPRESS_TOOLS=false  # НЕ компрессировать tool_calls (критично для Hermes)
      - HEADROOM_KEEP_TURNS=2  # Всегда сохранять последние 2 сообщения (user + assistant)

      # Output token reduction (опционально, выключено по умолчанию)
      - HEADROOM_OUTPUT_SHAPER=0  # 1 = включить сокращение ответов модели

      # Статистика и мониторинг
      - HEADROOM_STATS=true  # Включить метрики
      - HEADROOM_UPDATE_CHECK=off  # Отключить проверку обновлений (в продакшене)

      # Логирование
      - LOG_LEVEL=INFO
    command: ["--port", "8787", "--host", "0.0.0.0"]
    networks:
      - aim-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Hermes — добавляем зависимость от headroom-proxy
  hermes:
    depends_on:
      headroom-proxy:
        condition: service_healthy
    environment:
      # Перенаправить Hermes через HeadroomGuard прокси
      - OMNIROUTE_URL=http://headroom-proxy:8787/v1
      # Оригинальный auth передаётся прокси через HEADROOM_UPSTREAM_AUTH выше
      # Модель остаётся та же
      - LLM_MODEL=glm-5

networks:
  aim-network:
    name: aim_aim-network
    external: true
