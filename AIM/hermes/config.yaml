# Hermes v3.3 Configuration (restored 2026-06-25)
# ==================================================
# v7 state machine and 14-phase pipeline removed.
# LLM (Hermes) is the sole orchestrator via tools.registry.

# ── Overall runtime ─────────────────────────────────────────────────
runtime:
  # Total deadline for a single run_agent() call (seconds).
  # Was 900 in v3.3; bumped to 1800 for deeper PRESALE runs with 28 tools.
  total_timeout: 1800

# ── File Protection (file_guard) ─────────────────────────────────────
# These values are read by app/file_guard.py at startup. The guard
# protects critical config files from LLM-driven writes in any mode
# and restricts ADMIN-mode writes to a whitelist.
file_protection:
  blocked_paths:
    - /opt/hermes-data/app/
    - /opt/hermes/app/
    - /opt/hermes-data/config.yaml
    - /opt/hermes/config.yaml
    - /opt/hermes-data/.env
    - /opt/hermes/.env

  admin_whitelist:
    - /opt/hermes-data/skills/
    - /opt/hermes-data/memory/
    - /opt/data/memories/
    - /opt/hermes/skills/
    - /opt/hermes/memory/

  config_chmod: "0444"

# ── Toolsets ────────────────────────────────────────────────────────
# Hermes enables toolsets based on mode. PRESALE gets business tools only;
# ADMIN/ACTIVE/SALES_ADMIN additionally get hermes-debug for shell/file access.
# Note: Mode Gate for ONBOARDING was removed (it was blocking file_write and
# shell_exec in PRESALE — which broke report generation).
toolsets:
  PRESALE:     ["aim-operations"]
  ACTIVE:      ["aim-operations", "hermes-debug"]
  ADMIN:       ["aim-operations", "hermes-debug"]
  SALES_ADMIN: ["aim-operations", "hermes-debug"]
