# Hermes v7 Configuration
# ========================

# ── Pipeline (v7 State Machine) ──────────────────────────────────────
pipeline:
  # Таймауты фаз (в секундах)
  timeouts:
    preflight: 30
    perplexity: 120
    tech_audit: 300
    social_verifier: 180
    content_analysis: 120
    key_persons: 180
    smi_mentions: 120
    competitors: 600
    forum_pains: 120
    finance: 60
    content_plan: 120
    html_build: 120
    qc_critique: 90
    presentation: 60

  # Максимальное время всего пайплайна (секунд)
  total_timeout: 900

  # Ретраи
  max_retries_default: 1
  competitor_max_retries: 3

# ── File Protection ─────────────────────────────────────────────────
file_protection:
  # Заблокированные пути (всегда, для любого режима)
  blocked_paths:
    - /opt/hermes-data/app/
    - /opt/hermes/app/
    - /opt/hermes-data/config.yaml
    - /opt/hermes/config.yaml
    - /opt/hermes-data/.env
    - /opt/hermes/.env

  # Whitelist для ADMIN режима
  admin_whitelist:
    - /opt/hermes-data/skills/
    - /opt/hermes-data/memory/
    - /opt/data/memories/
    - /opt/hermes/skills/
    - /opt/hermes/memory/

  # Chmod для config.yaml при старте
  config_chmod: "0444"

# ── Mode Gate ───────────────────────────────────────────────────────
mode_gate:
  # ONBOARDING блокирует эти инструменты даже если они в aim-operations
  onboarding_blocked_tools:
    - orchestrate
    - search_chats
    - send_message_as_user
    - show_all_leads
    - get_lead_pipeline
    - file_write
    - shell_exec
    - restart_myself

  # Toolset'ы по режимам
  toolsets:
    onboarding: ["aim-operations"]
    presale: ["aim-operations"]
    admin: ["aim-operations", "hermes-debug"]
    active: ["aim-operations", "hermes-debug"]
    sales_admin: ["aim-operations", "hermes-debug"]
