global:
  resolve_timeout: 5m
  telegram_api_url: "https://api.telegram.org"

route:
  receiver: 'telegram-critical'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'telegram-critical'
      repeat_interval: 15m
    - match:
        severity: warning
      receiver: 'telegram-warning'
      repeat_interval: 1h

receivers:
  - name: 'telegram-critical'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: 'HTML'
        message: |
          <b>{{ .Status | toUpper }}</b>: {{ .CommonLabels.alertname }}
          {{ range .Alerts }}
          {{ .Annotations.description }}
          {{ end }}
  - name: 'telegram-warning'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: 'HTML'
        message: |
          <b>{{ .Status | toUpper }}</b>: {{ .CommonLabels.alertname }}
          {{ range .Alerts }}
          {{ .Annotations.description }}
          {{ end }}
