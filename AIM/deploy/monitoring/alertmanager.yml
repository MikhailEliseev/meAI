global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: 'default'
    # Telegram and email receivers disabled until credentials are configured.
    # When ready, uncomment the blocks below and set env vars:
    #   TELEGRAM_BOT_TOKEN, TELEGRAM_ADMIN_CHAT_ID, SENDGRID_API_KEY
