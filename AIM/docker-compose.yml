services:
  # SearXNG — free meta-search engine for competitor discovery (v2 pipeline)
  searxng:
    image: searxng/searxng:latest
    container_name: aim-searxng
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - aim-network

  postgres:
    image: postgres:16-alpine
    container_name: aim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aim_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aim_db}
      POSTGRES_INITDB_ARGS: "--locale=ru_RU.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "127.0.0.1:5432:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aim_user} -d ${POSTGRES_DB:-aim_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aim-network

  app:
    build:
      context: ..
      dockerfile: AIM/Dockerfile
    image: aim:latest
    container_name: aim-app
    init: true
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - HERMES_URL=http://hermes:8000
      - PYTHONPATH=/app/AIM:/app:/app/src
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - SEARXNG_URL=http://aim-searxng:8080
    env_file:
      - .env.production
    volumes:
      - ./data/production:/app/data/production
      - ./logs:/app/logs
      - ./obsidian:/app/AIM/obsidian
      - ./data:/app/AIM/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aim-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  hermes:
    build: ./hermes
    image: aim-hermes:latest
    container_name: aim-hermes
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - HERMES_HOME=/opt/data
      - HERMES_CACHE_DIR=/opt/data/cache
      - PYTHONUNBUFFERED=1
      - OMNIROUTE_URL=https://api.deepseek.com/v1
      # WordPress DB — for HTML report publishing
      - WP_DB_HOST=aim-mysql
      - WP_DB_USER=wp_user
      - WP_DB_PASSWORD=${WP_DB_PASSWORD}
      - WP_DB_NAME=wordpress
      - SESSIONS_ROOT=/opt/data/sessions-archive
      - ARCHIVE_BASE_URL=https://iamaim.ru/wp-json/aim/v1/session
    env_file:
      - .env.production
    volumes:
      - hermes_data:/opt/data
      - ./hermes/skills:/opt/hermes/skills:ro
    networks:
      - aim-network
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

  # Гермес v2 — интерактивная переработка (Walking Skeleton, Phase 1).
  # Тонкий «мозг»: FastAPI + один тул find_competitors (прокси к aim-app).
  # Старый сервис hermes НЕ трогаем — страховка отката.
  hermes-v2:
    build: ./hermes-v2
    image: aim-hermes-v2:latest
    container_name: aim-hermes-v2
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Phase 1: единственный обязательный env
      - AIM_API_BASE=http://aim-app:8000
      # Phase 2-3: LLM — OMNIROUTE_URL хардкод (z.ai-шлюз); OMNIROUTE_AUTH из .env.production
      - OMNIROUTE_URL=https://api.z.ai/api/coding/paas/v4
      - LLM_MODEL=glm-5.2
      # Phase 5: WordPress DB для публикации отчётов
      - WP_DB_HOST=aim-mysql
      - WP_DB_USER=wp_user
      - WP_DB_PASSWORD=${WP_DB_PASSWORD}
      - WP_DB_NAME=wordpress
      - SESSIONS_ROOT=/opt/data/sessions-archive
      - ARCHIVE_BASE_URL=https://iamaim.ru/wp-json/aim/v1/session
    env_file:
      - .env.production
      - .env.keys
    volumes:
      - /opt/hermes-v2-data:/opt/data
      - /opt/aim/AIM/data/apify_keys.json:/opt/data/apify_keys.json:ro
    networks:
      - aim-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    image: aim-frontend:latest
    container_name: aim-frontend
    restart: unless-stopped
    expose:
      - "3099"
    environment:
      - NODE_ENV=production
      - PORT=3099
      - HOST=0.0.0.0
      - NEXT_PUBLIC_BASE_URL=https://iamaim.ru
    env_file:
      - .env.production
    volumes:
      - /opt/aim/leads:/opt/data/leads
    networks:
      - aim-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://aim-frontend:3099"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: aim-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aim-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  wordpress:
    image: wordpress:php8.2-fpm-alpine
    container_name: aim-wordpress
    restart: unless-stopped
    expose:
      - "9000"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://iamaim.ru');
        define('WP_SITEURL', 'https://iamaim.ru');
        define('HERMES_API_URL', 'http://hermes:8000');
    volumes:
      - aim_wp_content:/var/www/html/wp-content
      # aim-theme is in wp_content volume — no local mount needed
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aim-network
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mysql:
    image: mariadb:11
    container_name: aim-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
    volumes:
      - aim_wp_db:/var/lib/mysql
    networks:
      - aim-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: aim-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/iamaim.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - aim_wp_content:/var/www/html/wp-content:ro
    depends_on:
      - app
      - wordpress
    networks:
      - aim-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: aim-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - aim-network

  grafana:
    image: grafana/grafana:latest
    container_name: aim-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - aim-network

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: aim-postgres-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      DATA_SOURCE_URI: "postgres:5432/aim_db?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_USER:-aim_user}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aim-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: aim-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - aim-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: aim-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - aim-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  aim-network:
    driver: bridge

volumes:
  postgres_data:
  redis-data:
  prometheus-data:
  grafana-data:
  hermes_data:
  aim_wp_content:
    external: true
  aim_wp_db:
    external: true
