# Prioritization Weights Configuration
#
# Used by PriorityCalculator to compute keyword priority scores.
# Formula: (Volume × Intent × Position) / Difficulty
#
# Adjustments:
# - Medical intent boost: +20% transactional, +15% informational
# - SERP penalty: -20% to -50% based on AI Overview/Featured Snippet
# - Compliance penalty: -50% HIGH risk, -100% CRITICAL risk

version: "1.0.1"
updated_at: "2026-05-12T02:19:00Z"

# Base formula weights
formula:
  volume_weight: 1.0        # Search volume importance
  intent_weight: 1.0        # Commercial intent importance
  position_weight: 1.0      # Current ranking importance
  difficulty_weight: 1.0    # SEO difficulty penalty

# Intent multipliers (applied to intent_score)
intent:
  transactional: 1.4        # "buy", "cost", "price", "near me"
  commercial: 1.3           # "best", "top", "review", "vs"
  informational: 1.1        # "what", "how", "why", "guide"
  navigational: 1.0         # Brand/product names

# Medical intent boost (added to base score)
# Reduced from +40%/+30% to +20%/+15% based on product review
medical_boost:
  transactional: 0.2        # +20% for "dental implants cost"
  commercial: 0.175         # +17.5% for "best dentist"
  informational: 0.15       # +15% for "how dental implants work"
  navigational: 0.0         # No boost for brand searches

# Position bonus (multiplier based on current ranking)
position:
  top_3: 1.0                # Already ranking 1-3
  top_10: 0.9               # Ranking 4-10
  top_20: 0.8               # Ranking 11-20
  top_50: 0.7               # Ranking 21-50
  top_100: 0.6              # Ranking 51-100
  not_ranking: 0.5          # Not in top 100

# SERP feature penalties (multiplier applied to final score)
serp_penalties:
  ai_overview: 0.5          # -50% if AI Overview present
  featured_snippet: 0.3     # -30% if Featured Snippet present
  people_also_ask: 0.2      # -20% if PAA present
  local_pack: 0.25          # -25% if Local Pack present
  knowledge_panel: 0.4      # -40% if Knowledge Panel present

# Compliance penalties (multiplier applied to final score)
compliance_penalties:
  critical: 1.0             # -100% (blocked)
  high: 0.5                 # -50%
  medium: 0.1               # -10%
  low: 0.0                  # No penalty

# Priority tier thresholds
tiers:
  p0_min: 80                # P0: 80-100
  p1_min: 60                # P1: 60-79
  p2_min: 40                # P2: 40-59
  p3_min: 0                 # P3: 0-39

# Volume normalization (log scale)
volume:
  min_volume: 10            # Minimum volume to consider
  max_volume: 100000        # Maximum volume for normalization
  log_base: 10              # Logarithmic scale base

# Difficulty normalization
difficulty:
  min_difficulty: 0         # Minimum difficulty
  max_difficulty: 100       # Maximum difficulty
  threshold_easy: 30        # Easy keywords (0-30)
  threshold_medium: 60      # Medium keywords (31-60)
  threshold_hard: 100       # Hard keywords (61-100)

# Adaptive learning settings
learning:
  enabled: true             # Enable adaptive weight adjustment
  min_feedback_count: 50    # Minimum feedback before adjustment
  adjustment_rate: 0.1      # Max adjustment per iteration (10%)
  confidence_threshold: 0.8 # Minimum confidence for adjustment
  feedback_window_days: 30  # Feedback window for learning

# Quality gates
quality:
  min_confidence: 0.7       # Minimum confidence to include keyword
  max_cost_per_keyword: 0.05 # Maximum API cost per keyword ($0.05)
  min_keywords_returned: 10  # Minimum keywords to return
  max_keywords_returned: 500 # Maximum keywords to return
