# FDA Prohibited Language Patterns for Medical Marketing
#
# Based on FDA regulations for medical device, drug, and supplement marketing.
# Each pattern includes severity (1-5) and rationale for prohibition.
#
# Severity levels:
# 5 - CRITICAL: Explicit FDA violation, immediate enforcement risk
# 4 - HIGH: Strong regulatory concern, likely enforcement
# 3 - MEDIUM: Regulatory gray area, moderate risk
# 2 - LOW: Potentially misleading, minor risk
# 1 - MINIMAL: Best practice violation, very low risk

# Category: Cure Claims (Severity: 5)
# FDA prohibits cure claims without approval
cure_claims:
  - pattern: '\bcure[sd]?\b'
    severity: 5
    rationale: "FDA prohibits cure claims for diseases without drug approval"

  - pattern: '\beliminate[sd]?\b.{0,20}\b(disease|condition|cancer|diabetes|arthritis|alzheimer)'
    severity: 5
    rationale: "Elimination claims are equivalent to cure claims"

  - pattern: '\beradicate[sd]?\b.{0,20}\b(disease|condition|cancer|tumor)'
    severity: 5
    rationale: "Eradication claims imply cure without approval"

  - pattern: '\breverse[sd]?\b.{0,20}\b(diabetes|cancer|heart disease|alzheimer)'
    severity: 5
    rationale: "Reversal claims for serious diseases require FDA approval"

  - pattern: '\bheals?\b.{0,20}\b(cancer|diabetes|heart disease|arthritis)'
    severity: 5
    rationale: "Healing claims for serious diseases are prohibited"

# Category: Treatment Claims (Severity: 4-5)
# Treating diseases requires FDA approval
treatment_claims:
  - pattern: '\btreat[s]?\b.{0,20}\b(cancer|diabetes|heart disease|alzheimer|arthritis)'
    severity: 5
    rationale: "Treatment claims for serious diseases require drug approval"

  - pattern: '\btherapy\b.{0,20}\bfor\b.{0,20}\b(cancer|diabetes|heart disease)'
    severity: 5
    rationale: "Therapy claims imply medical treatment"

  - pattern: '\bmedication\b.{0,20}\bfor\b.{0,20}\b(depression|anxiety|adhd)'
    severity: 5
    rationale: "Medication claims require prescription drug approval"

  - pattern: '\btreatment\b.{0,20}\bfor\b.{0,20}\b(covid|coronavirus|pandemic)'
    severity: 5
    rationale: "COVID treatment claims are heavily enforced by FDA"

# Category: Diagnostic Claims (Severity: 5)
# Diagnosing diseases requires FDA approval for medical devices
diagnostic_claims:
  - pattern: '\bdiagnose[sd]?\b.{0,20}\b(cancer|diabetes|disease)'
    severity: 5
    rationale: "Diagnostic claims require medical device approval"

  - pattern: '\bdetect[s]?\b.{0,20}\b(cancer|tumor|disease)'
    severity: 5
    rationale: "Detection claims are diagnostic and require approval"

  - pattern: '\btest[s]?\b.{0,20}\bfor\b.{0,20}\b(covid|cancer|diabetes)'
    severity: 5
    rationale: "Testing claims require diagnostic device approval"

# Category: Prevention Claims (Severity: 4-5)
# Preventing diseases requires FDA approval
prevention_claims:
  - pattern: '\bprevent[s]?\b.{0,20}\b(cancer|heart attack|stroke|alzheimer)'
    severity: 5
    rationale: "Prevention claims for serious diseases require approval"

  - pattern: '\bprotect[s]?\b.{0,20}\bagainst\b.{0,20}\b(cancer|heart disease|diabetes)'
    severity: 5
    rationale: "Protection claims imply disease prevention"

  - pattern: '\bimmune\b.{0,20}\bto\b.{0,20}\b(covid|flu|disease)'
    severity: 5
    rationale: "Immunity claims require vaccine approval"

  - pattern: '\bvaccine\b.{0,20}\bfor\b.{0,20}\b(covid|flu|cancer)'
    severity: 5
    rationale: "Vaccine claims require FDA approval"

# Category: Guarantees (Severity: 4)
# Guarantees of results are prohibited
guarantees:
  - pattern: '\bguaranteed?\b.{0,20}\b(results|cure|relief|weight loss)'
    severity: 4
    rationale: "FDA prohibits guaranteed results claims"

  - pattern: '\b100%\b.{0,20}\b(effective|safe|cure|relief)'
    severity: 4
    rationale: "Absolute effectiveness claims are prohibited"

  - pattern: '\bpermanent\b.{0,20}\b(cure|relief|solution|results)'
    severity: 4
    rationale: "Permanent results guarantees are prohibited"

  - pattern: '\bno side effects\b'
    severity: 4
    rationale: "Claiming no side effects is misleading and prohibited"

  - pattern: '\brisk[- ]free\b'
    severity: 4
    rationale: "Risk-free claims are misleading"

# Category: FDA Misrepresentation (Severity: 5)
# Misrepresenting FDA status is illegal
fda_misrepresentation:
  - pattern: '\bFDA[- ]approved\b.{0,20}\b(supplement|vitamin|herb)'
    severity: 5
    rationale: "FDA does not approve supplements - illegal misrepresentation"

  - pattern: '\bFDA[- ]certified\b'
    severity: 5
    rationale: "FDA does not certify products - illegal claim"

  - pattern: '\bFDA[- ]endorsed\b'
    severity: 5
    rationale: "FDA does not endorse products - illegal claim"

  - pattern: '\bapproved by FDA\b.{0,20}\b(for|to)\b.{0,20}\b(cure|treat|prevent)'
    severity: 5
    rationale: "False FDA approval claims are illegal"

# Category: Drug Claims for Supplements (Severity: 5)
# Supplements cannot make drug claims
supplement_drug_claims:
  - pattern: '\b(supplement|vitamin|herb|natural)\b.{0,50}\b(cure|treat|prevent|diagnose)'
    severity: 5
    rationale: "Supplements making drug claims become unapproved drugs"

  - pattern: '\bdietary supplement\b.{0,50}\b(for|treats?|cures?)\b.{0,20}\b(disease|condition)'
    severity: 5
    rationale: "Supplements cannot claim to treat diseases"

  - pattern: '\bherbal\b.{0,30}\b(medicine|treatment|therapy|cure)'
    severity: 5
    rationale: "Herbal products making medical claims are unapproved drugs"

# Category: Miracle/Breakthrough Claims (Severity: 4)
# Exaggerated claims are prohibited
miracle_claims:
  - pattern: '\bmiracle\b.{0,20}\b(cure|treatment|drug|supplement)'
    severity: 4
    rationale: "Miracle claims are exaggerated and misleading"

  - pattern: '\bbreakthrough\b.{0,20}\b(cure|treatment)'
    severity: 4
    rationale: "Breakthrough claims without evidence are misleading"

  - pattern: '\bsecret\b.{0,20}\b(cure|formula|ingredient)'
    severity: 4
    rationale: "Secret cure claims are deceptive"

  - pattern: '\bscientific breakthrough\b'
    severity: 4
    rationale: "Unsubstantiated breakthrough claims are prohibited"

# Category: Comparison Claims (Severity: 3-4)
# Comparative claims require substantiation
comparison_claims:
  - pattern: '\bbetter than\b.{0,20}\b(prescription|drugs?|medication)'
    severity: 4
    rationale: "Superiority claims over drugs require clinical evidence"

  - pattern: '\bsafer than\b.{0,20}\b(prescription|drugs?|surgery)'
    severity: 4
    rationale: "Safety comparisons require clinical evidence"

  - pattern: '\bmore effective than\b.{0,20}\b(drugs?|medication|treatment)'
    severity: 4
    rationale: "Effectiveness comparisons require clinical trials"

  - pattern: '\breplace[s]?\b.{0,20}\b(prescription|medication|drugs?)'
    severity: 4
    rationale: "Replacement claims imply drug equivalence"

# Category: Disease-Specific High-Risk (Severity: 5)
# Certain diseases have heightened FDA enforcement
high_risk_diseases:
  - pattern: '\bcovid[- ]?19\b.{0,30}\b(cure|treat|prevent|protect)'
    severity: 5
    rationale: "COVID claims are heavily enforced by FDA"

  - pattern: '\bcoronavirus\b.{0,30}\b(cure|treat|prevent|protect)'
    severity: 5
    rationale: "Coronavirus claims are heavily enforced"

  - pattern: '\bcancer\b.{0,30}\b(cure|treat|shrink|eliminate)'
    severity: 5
    rationale: "Cancer cure claims are strictly prohibited"

  - pattern: '\bhiv\b.{0,30}\b(cure|treat|prevent)'
    severity: 5
    rationale: "HIV claims are strictly enforced"

  - pattern: '\balzheimer\b.{0,30}\b(cure|reverse|prevent)'
    severity: 5
    rationale: "Alzheimer's claims are strictly enforced"

# Category: Weight Loss Claims (Severity: 3-4)
# Weight loss claims are heavily scrutinized
weight_loss_claims:
  - pattern: '\blose\b.{0,10}\b\d+\b.{0,10}\b(pounds?|lbs?|kg)\b.{0,10}\b(in|within)\b.{0,10}\b\d+\b.{0,10}\b(days?|weeks?)'
    severity: 4
    rationale: "Specific weight loss timeframes are prohibited without evidence"

  - pattern: '\brapid weight loss\b'
    severity: 3
    rationale: "Rapid weight loss claims require substantiation"

  - pattern: '\blose weight\b.{0,20}\bwithout\b.{0,20}\b(diet|exercise)'
    severity: 4
    rationale: "Weight loss without effort claims are deceptive"

  - pattern: '\bburn fat\b.{0,20}\bwhile you sleep\b'
    severity: 4
    rationale: "Effortless fat burning claims are deceptive"

# Category: Testimonial Issues (Severity: 3)
# Testimonials must be typical results
testimonial_issues:
  - pattern: '\bresults may vary\b'
    severity: 1
    rationale: "Required disclaimer, but flags testimonial usage"

  - pattern: '\btypical results\b'
    severity: 1
    rationale: "Testimonials must represent typical results"

  - pattern: '\bindividual results\b'
    severity: 1
    rationale: "Flags potential testimonial compliance issues"

# Category: Structure/Function Violations (Severity: 3-4)
# Supplements can make structure/function claims but not disease claims
structure_function_violations:
  - pattern: '\bsupports?\b.{0,20}\b(immune system|heart health|brain function)'
    severity: 1
    rationale: "Acceptable structure/function claim if properly disclaimed"

  - pattern: '\bpromotes?\b.{0,20}\b(healthy|normal)\b.{0,20}\b(function|levels?)'
    severity: 1
    rationale: "Acceptable structure/function claim if properly disclaimed"

  - pattern: '\bmaintains?\b.{0,20}\b(healthy|normal)'
    severity: 1
    rationale: "Acceptable structure/function claim if properly disclaimed"

# Category: Prescription Drug Names (Severity: 5)
# Using prescription drug names for non-drugs is prohibited
prescription_drug_names:
  - pattern: '\b(lipitor|viagra|cialis|prozac|xanax|adderall)\b'
    severity: 5
    rationale: "Using prescription drug names for non-drugs is trademark violation"

  - pattern: '\balternative to\b.{0,20}\b(lipitor|viagra|prozac)'
    severity: 4
    rationale: "Alternative to prescription drug claims require evidence"

# Category: Clinical/Medical Terminology Misuse (Severity: 3-4)
# Medical terms imply medical claims
medical_terminology_misuse:
  - pattern: '\bclinically proven\b'
    severity: 3
    rationale: "Clinical proof claims require published clinical trials"

  - pattern: '\bmedically proven\b'
    severity: 3
    rationale: "Medical proof claims require clinical evidence"

  - pattern: '\bdoctor[- ]?recommended\b'
    severity: 3
    rationale: "Doctor recommendation claims require substantiation"

  - pattern: '\bprescription[- ]?strength\b'
    severity: 4
    rationale: "Prescription strength claims for non-drugs are misleading"

# Category: Anti-Aging Claims (Severity: 3)
# Anti-aging claims are scrutinized
anti_aging_claims:
  - pattern: '\banti[- ]?aging\b.{0,20}\b(miracle|breakthrough|cure)'
    severity: 4
    rationale: "Exaggerated anti-aging claims are prohibited"

  - pattern: '\breverse[s]?\b.{0,20}\b(aging|wrinkles)'
    severity: 3
    rationale: "Reversal claims require substantiation"

  - pattern: '\bturn back\b.{0,20}\b(time|clock|aging)'
    severity: 3
    rationale: "Exaggerated anti-aging claims are misleading"
