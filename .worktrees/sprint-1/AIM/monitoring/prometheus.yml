global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aim-agency'
    environment: 'production'

scrape_configs:
  # AIM Agency Application Metrics
  - job_name: 'aim-agency'
    static_configs:
      - targets: ['aim-agency:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis Metrics (if redis_exporter is added)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
